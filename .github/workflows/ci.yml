name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Bootstrap lockfile on this scaffold branch
        if: github.event_name == 'push'
        run: |
          if git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: lock scaffold dependencies'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Typecheck, build, and contract tests
        run: pnpm run check

      - name: Verify git-install prepare path from a clean output tree
        run: |
          pnpm run clean
          pnpm run prepare
          node --test ./tests/*.test.mjs

      - name: Verify packed file surface
        run: |
          mkdir -p .artifacts
          pnpm pack --pack-destination .artifacts
          tarball=$(find .artifacts -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$tarball"
          tar -tzf "$tarball" | sort | tee .artifacts/package-files.txt
          grep -Fx 'package/lib/index.js' .artifacts/package-files.txt
          grep -Fx 'package/cordis.patch.yml' .artifacts/package-files.txt
          grep -Fx 'package/package.json' .artifacts/package-files.txt
