name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 22.20.0
          - 24.11.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, build, and contract tests
        run: pnpm run check

      - name: Verify git-install prepare path from a clean output tree
        run: |
          pnpm run clean
          pnpm run prepare
          node --test ./tests/prepare-contract.test.mjs

  settings-modern:
    name: modern Settings runtime (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        version:
          - 0.1.2-rc.1
          - 0.1.5-rc.1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.20.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install legacy-locked development dependencies
        run: pnpm install --frozen-lockfile

      - name: Switch the ephemeral test workspace to the selected modern Settings generation
        run: |
          pnpm add --save-dev --save-exact \
            @deepseek-ai/cordis@4.0.2 \
            @deepseek-ai/dsh-settings@${{ matrix.version }} \
            @deepseek-ai/schemastery@3.18.2

      - name: Assert the modern public Settings API shape
        run: |
          node --input-type=module -e "const api = await import('@deepseek-ai/dsh-settings'); if (typeof api.installSettingsSection !== 'undefined') throw new Error('expected the modern Settings generation without module-level installSettingsSection'); if (typeof api.SettingsProvider?.prototype?.installSection !== 'function') throw new Error('expected SettingsProvider.installSection() in the modern Settings generation')"

      - name: Run the full type, build, and Domain regression suite on modern Settings
        run: pnpm run check

  agent-presets-contract:
    name: AgentPreset Host contract (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        version:
          - 0.1.1-rc.2
          - 0.1.2-rc.1
          - 0.1.5-rc.1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.20.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the selected native AgentPreset package in the ephemeral workspace
        run: pnpm add --save-dev --save-exact @deepseek-ai/dsh-agent-presets@${{ matrix.version }}

      - name: Compile the minimum public Host contract fixture
        run: |
          pnpm exec tsc \
            --ignoreConfig \
            --noEmit \
            --strict \
            --skipLibCheck \
            --module NodeNext \
            --moduleResolution NodeNext \
            --target ES2024 \
            tests/agent-presets-upstream-contract.ts

      - name: Build and run M3C compatibility behavior against this dependency generation
        run: |
          pnpm run build
          node --test ./tests/preset-authoring.test.mjs

  session-preset-contract:
    name: Session preset Host contract (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 0.1.1-rc.2
            cordis: 4.0.1
            fixture: legacy
          - version: 0.1.2-rc.1
            cordis: 4.0.2
            fixture: current
          - version: 0.1.5-rc.1
            cordis: 4.0.2
            fixture: current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.20.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the selected Session/AgentPreset generation in the ephemeral workspace
        run: |
          pnpm add --save-dev --save-exact \
            @deepseek-ai/cordis@${{ matrix.cordis }} \
            @deepseek-ai/dsh-session@${{ matrix.version }} \
            @deepseek-ai/dsh-session-projection@${{ matrix.version }} \
            @deepseek-ai/dsh-agent-presets@${{ matrix.version }}

      - name: Compile only the public Host seam consumed by this generation
        run: |
          pnpm exec tsc \
            --ignoreConfig \
            --noEmit \
            --strict \
            --skipLibCheck \
            --module NodeNext \
            --moduleResolution NodeNext \
            --target ES2024 \
            tests/session-preset-${{ matrix.fixture }}-upstream-contract.ts

      - name: Build and run M3B compatibility behavior against this dependency generation
        run: |
          pnpm run build
          node --test ./tests/session-preset.test.mjs
          node ./tests/session-preset-upstream-runtime.mjs

  package:
    name: verify packed bundle
    needs:
      - verify
      - settings-modern
      - agent-presets-contract
      - session-preset-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.20.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Verify packed file surface
        run: |
          mkdir -p .artifacts
          pnpm pack --pack-destination .artifacts
          tarball=$(find .artifacts -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$tarball"
          tar -tzf "$tarball" | sort | tee .artifacts/package-files.txt
          grep -Fx 'package/lib/index.js' .artifacts/package-files.txt
          grep -Fx 'package/lib/index.d.ts' .artifacts/package-files.txt
          grep -Fx 'package/cordis.patch.yml' .artifacts/package-files.txt
          grep -Fx 'package/package.json' .artifacts/package-files.txt

  dsh-smoke:
    name: published DSH bundle smoke (${{ matrix.version }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        version:
          - 0.1.2-rc.1
          - 0.1.5-rc.1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DSH_HOME: ${{ github.workspace }}/.dsh-ci-home-${{ matrix.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.20.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install and build this plugin
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install bundle into a temporary DSH profile
        run: pnpm dlx @deepseek-ai/dsh@${{ matrix.version }} plugin --profile context-manager-ci add "$GITHUB_WORKSPACE"

      - name: Verify DSH composed configuration
        run: |
          pnpm dlx @deepseek-ai/dsh@${{ matrix.version }} --profile context-manager-ci --dump-config > .dsh-composed.yml
          grep -F 'dsh-context-manager' .dsh-composed.yml
