name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.20.0, 24.11.0]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, build, and contract tests
        run: pnpm run check
      - name: Verify git-install prepare path from a clean output tree
        run: |
          pnpm run clean
          pnpm run prepare
          node --test ./tests/prepare-contract.test.mjs

  settings-modern:
    name: modern Settings runtime (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        version: [0.1.2-rc.1, 0.1.5-rc.1, 0.1.5-rc.2, 0.1.6-alpha.2]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Switch the ephemeral test workspace to the selected modern Settings generation
        run: |
          pnpm add --save-dev --save-exact \
            @deepseek-ai/cordis@4.0.2 \
            @deepseek-ai/dsh-settings@${{ matrix.version }} \
            @deepseek-ai/dsh-typert-protocol@${{ matrix.version }} \
            @deepseek-ai/schemastery@3.18.2
      - name: Assert the modern public Settings API shape
        run: |
          node --input-type=module -e "const api = await import('@deepseek-ai/dsh-settings'); if (typeof api.installSettingsSection !== 'undefined') throw new Error('expected the modern Settings generation without module-level installSettingsSection'); if (typeof api.SettingsProvider?.prototype?.installSection !== 'function') throw new Error('expected SettingsProvider.installSection() in the modern Settings generation')"
      - run: pnpm run check

  agent-presets-contract:
    name: AgentPreset Host contract (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: 0.1.1-rc.2, cordis: 4.0.1 }
          - { version: 0.1.2-rc.1, cordis: 4.0.2 }
          - { version: 0.1.5-rc.1, cordis: 4.0.2 }
          - { version: 0.1.5-rc.2, cordis: 4.0.2 }
          - { version: 0.1.6-alpha.2, cordis: 4.0.2 }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DSH_HOME: ${{ github.workspace }}/.dsh-m3c-home-${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install selected AgentPreset generation
        run: |
          pnpm add --save-dev --save-exact \
            @deepseek-ai/cordis@${{ matrix.cordis }} \
            @deepseek-ai/cordis-plugin-loader@1.0.3 \
            @deepseek-ai/dsh-agent-presets@${{ matrix.version }} \
            @deepseek-ai/dsh-typert-protocol@${{ matrix.version }} \
            @deepseek-ai/dsh-session-projection@${{ matrix.version }}
      - name: Compile public Host contract
        run: |
          pnpm exec tsc --ignoreConfig --noEmit --strict --skipLibCheck --module NodeNext --moduleResolution NodeNext --target ES2024 tests/agent-presets-upstream-contract.ts
      - name: Run M3C compatibility behavior
        run: |
          pnpm run build
          node --test ./tests/preset-authoring.test.mjs
          node ./tests/preset-authoring-upstream-runtime.mjs

  session-preset-contract:
    name: Session preset Host contract (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: 0.1.1-rc.2, cordis: 4.0.1, fixture: legacy }
          - { version: 0.1.2-rc.1, cordis: 4.0.2, fixture: current }
          - { version: 0.1.5-rc.1, cordis: 4.0.2, fixture: current }
          - { version: 0.1.5-rc.2, cordis: 4.0.2, fixture: current }
          - { version: 0.1.6-alpha.2, cordis: 4.0.2, fixture: current }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install selected Session generation
        run: |
          pnpm add --save-dev --save-exact \
            @deepseek-ai/cordis@${{ matrix.cordis }} \
            @deepseek-ai/dsh-session@${{ matrix.version }} \
            @deepseek-ai/dsh-session-projection@${{ matrix.version }} \
            @deepseek-ai/dsh-typert-protocol@${{ matrix.version }} \
            @deepseek-ai/dsh-agent-presets@${{ matrix.version }}
      - name: Compile public Host seam
        run: |
          pnpm exec tsc --ignoreConfig --noEmit --strict --skipLibCheck --module NodeNext --moduleResolution NodeNext --target ES2024 tests/session-preset-${{ matrix.fixture }}-upstream-contract.ts
      - name: Run M3B compatibility behavior
        run: |
          pnpm run build
          node --test ./tests/session-preset.test.mjs
          node ./tests/session-preset-upstream-runtime.mjs

  prompt-library-contract:
    name: Prompt Library storage contract (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: 0.1.1-rc.2, cordis: 4.0.1 }
          - { version: 0.1.2-rc.1, cordis: 4.0.2 }
          - { version: 0.1.5-rc.1, cordis: 4.0.2 }
          - { version: 0.1.5-rc.2, cordis: 4.0.2 }
          - { version: 0.1.6-alpha.2, cordis: 4.0.2 }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install selected native Storage generation
        run: |
          pnpm add --save-dev --save-exact \
            @deepseek-ai/cordis@${{ matrix.cordis }} \
            @deepseek-ai/dsh-storage@${{ matrix.version }} \
            @deepseek-ai/dsh-storage-json@${{ matrix.version }} \
            @deepseek-ai/dsh-typert-protocol@${{ matrix.version }} \
            @deepseek-ai/dsh-storage-domain@${{ matrix.version }}
      - name: Compile public DomainSpec contract
        run: |
          pnpm exec tsc --ignoreConfig --noEmit --strict --skipLibCheck --module NodeNext --moduleResolution NodeNext --target ES2024 tests/prompt-library-upstream-contract.ts
      - name: Build and run M4A behavior
        run: |
          pnpm run build
          node --test ./tests/prompt-library.test.mjs
          node ./tests/prompt-library-upstream-runtime.mjs

  prompt-placement-contract:
    name: Prompt placement Host contract (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: 0.1.1-rc.2, cordis: 4.0.1, fixture: legacy, generation: legacy }
          - { version: 0.1.2-rc.1, cordis: 4.0.2, fixture: named, generation: named }
          - { version: 0.1.5-rc.1, cordis: 4.0.2, fixture: named, generation: named }
          - { version: 0.1.5-rc.2, cordis: 4.0.2, fixture: named, generation: named }
          - { version: 0.1.6-alpha.2, cordis: 4.0.2, fixture: named, generation: named }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install selected SystemPrompt generation
        run: |
          pnpm add --save-dev --save-exact \
            @deepseek-ai/cordis@${{ matrix.cordis }} \
            @deepseek-ai/dsh-typert-protocol@${{ matrix.version }} \
            @deepseek-ai/dsh-system-prompt@${{ matrix.version }}
      - name: Compile public SystemPrompt contract
        run: |
          pnpm exec tsc --ignoreConfig --noEmit --strict --skipLibCheck --module NodeNext --moduleResolution NodeNext --target ES2024 tests/prompt-placement-upstream-${{ matrix.fixture }}-contract.ts
      - name: Build and run M4C1 compatibility behavior
        env:
          DSH_PROMPT_GENERATION: ${{ matrix.generation }}
        run: |
          pnpm run build
          node --test ./tests/prompt-placement.test.mjs
          node ./tests/prompt-placement-upstream-runtime.mjs

  prompt-runtime-contract:
    name: Prompt runtime Host contract (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: 0.1.1-rc.2, cordis: 4.0.1, generation: legacy }
          - { version: 0.1.2-rc.1, cordis: 4.0.2, generation: named }
          - { version: 0.1.5-rc.1, cordis: 4.0.2, generation: named }
          - { version: 0.1.5-rc.2, cordis: 4.0.2, generation: named }
          - { version: 0.1.6-alpha.2, cordis: 4.0.2, generation: named }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install selected Agent/SystemPrompt generation
        run: |
          pnpm add --save-dev --save-exact \
            @deepseek-ai/cordis@${{ matrix.cordis }} \
            @deepseek-ai/dsh-agent@${{ matrix.version }} \
            @deepseek-ai/dsh-scope@${{ matrix.version }} \
            @deepseek-ai/dsh-typert-protocol@${{ matrix.version }} \
            @deepseek-ai/dsh-system-prompt@${{ matrix.version }}
      - name: Compile public M4C2 Host contract
        run: |
          pnpm exec tsc --ignoreConfig --noEmit --strict --skipLibCheck --module NodeNext --moduleResolution NodeNext --target ES2024 tests/prompt-runtime-upstream-contract.ts
      - name: Run scoped M4C2 runtime smoke
        env:
          DSH_M4C2_GENERATION: ${{ matrix.generation }}
        run: |
          pnpm run build
          node ./tests/prompt-runtime-upstream-runtime.mjs

  prompt-runtime-agent-loop:
    name: Prompt runtime AgentLoop E2E (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: 0.1.1-rc.2, cordis: 4.0.1, schemastery: 3.18.1, generation: legacy }
          - { version: 0.1.6-alpha.2, cordis: 4.0.2, schemastery: 3.18.2, generation: current }
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install selected real AgentLoop generation
        run: |
          pnpm add --save-dev --save-exact \
            @deepseek-ai/cordis@${{ matrix.cordis }} \
            @deepseek-ai/schemastery@${{ matrix.schemastery }} \
            @deepseek-ai/dsh-agent@${{ matrix.version }} \
            @deepseek-ai/dsh-agent-loop@${{ matrix.version }} \
            @deepseek-ai/dsh-invariants@${{ matrix.version }} \
            @deepseek-ai/dsh-llm@${{ matrix.version }} \
            @deepseek-ai/dsh-scope@${{ matrix.version }} \
            @deepseek-ai/dsh-session@${{ matrix.version }} \
            @deepseek-ai/dsh-session-persistence@${{ matrix.version }} \
            @deepseek-ai/dsh-session-projection@${{ matrix.version }} \
            @deepseek-ai/dsh-settings@${{ matrix.version }} \
            @deepseek-ai/dsh-skill@${{ matrix.version }} \
            @deepseek-ai/dsh-system-prompt@${{ matrix.version }} \
            @deepseek-ai/dsh-typert-protocol@${{ matrix.version }} \
            @deepseek-ai/dsh-tools@${{ matrix.version }}
      - name: Build and run real AgentLoop M4C2 E2E
        env:
          DSH_M4C2_E2E_GENERATION: ${{ matrix.generation }}
        run: |
          pnpm run build
          node ./tests/prompt-runtime-agent-loop.e2e.mjs

  skill-runtime-contract:
    name: Skill runtime Host contract (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: 0.1.1-rc.2, cordis: 4.0.1, schemastery: 3.18.1 }
          - { version: 0.1.2-rc.1, cordis: 4.0.2, schemastery: 3.18.2 }
          - { version: 0.1.5-rc.1, cordis: 4.0.2, schemastery: 3.18.2 }
          - { version: 0.1.5-rc.2, cordis: 4.0.2, schemastery: 3.18.2 }
          - { version: 0.1.6-alpha.2, cordis: 4.0.2, schemastery: 3.18.2 }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install selected Skill/Scope generation
        run: |
          pnpm add --save-dev --save-exact \
            @deepseek-ai/cordis@${{ matrix.cordis }} \
            @deepseek-ai/schemastery@${{ matrix.schemastery }} \
            @deepseek-ai/dsh-invariants@${{ matrix.version }} \
            @deepseek-ai/dsh-llm@${{ matrix.version }} \
            @deepseek-ai/dsh-scope@${{ matrix.version }} \
            @deepseek-ai/dsh-typert-protocol@${{ matrix.version }} \
            @deepseek-ai/dsh-skill@${{ matrix.version }}
      - name: Compile public M5 Skill/Scope contract
        run: |
          pnpm exec tsc --ignoreConfig --noEmit --strict --skipLibCheck --module NodeNext --moduleResolution NodeNext --target ES2024 tests/skill-runtime-upstream-contract.ts
      - name: Run scoped SkillRegistry contract behavior
        run: |
          node ./tests/skill-runtime-upstream-runtime.mjs

  skill-policy-runtime-contract:
    name: M5B Skill policy runtime (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: 0.1.1-rc.2, cordis: 4.0.1, schemastery: 3.18.1 }
          - { version: 0.1.2-rc.1, cordis: 4.0.2, schemastery: 3.18.2 }
          - { version: 0.1.5-rc.1, cordis: 4.0.2, schemastery: 3.18.2 }
          - { version: 0.1.5-rc.2, cordis: 4.0.2, schemastery: 3.18.2 }
          - { version: 0.1.6-alpha.2, cordis: 4.0.2, schemastery: 3.18.2 }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install selected Skill/Scope generation
        run: |
          pnpm add --save-dev --save-exact \
            @deepseek-ai/cordis@${{ matrix.cordis }} \
            @deepseek-ai/schemastery@${{ matrix.schemastery }} \
            @deepseek-ai/dsh-invariants@${{ matrix.version }} \
            @deepseek-ai/dsh-llm@${{ matrix.version }} \
            @deepseek-ai/dsh-scope@${{ matrix.version }} \
            @deepseek-ai/dsh-typert-protocol@${{ matrix.version }} \
            @deepseek-ai/dsh-skill@${{ matrix.version }}
      - name: Build M5B production runtime
        run: pnpm run build
      - name: Run M5B policy behavior
        run: |
          node --test \
            ./tests/skill-policy.test.mjs \
            ./tests/skill-runtime.test.mjs \
            ./tests/skill-runtime-service.test.mjs

  pinned-skill-runtime-contract:
    name: M5C Pinned Skill runtime (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: 0.1.1-rc.2, cordis: 4.0.1, schemastery: 3.18.1, generation: legacy }
          - { version: 0.1.2-rc.1, cordis: 4.0.2, schemastery: 3.18.2, generation: named }
          - { version: 0.1.5-rc.1, cordis: 4.0.2, schemastery: 3.18.2, generation: named }
          - { version: 0.1.5-rc.2, cordis: 4.0.2, schemastery: 3.18.2, generation: named }
          - { version: 0.1.6-alpha.2, cordis: 4.0.2, schemastery: 3.18.2, generation: named }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install selected Skill/SystemPrompt generation
        run: |
          pnpm add --save-dev --save-exact \
            @deepseek-ai/cordis@${{ matrix.cordis }} \
            @deepseek-ai/schemastery@${{ matrix.schemastery }} \
            @deepseek-ai/dsh-agent@${{ matrix.version }} \
            @deepseek-ai/dsh-invariants@${{ matrix.version }} \
            @deepseek-ai/dsh-llm@${{ matrix.version }} \
            @deepseek-ai/dsh-scope@${{ matrix.version }} \
            @deepseek-ai/dsh-skill@${{ matrix.version }} \
            @deepseek-ai/dsh-typert-protocol@${{ matrix.version }} \
            @deepseek-ai/dsh-system-prompt@${{ matrix.version }}
      - name: Build M5C production runtime
        run: pnpm run build
      - name: Run M5C pinned replacement behavior
        env:
          DSH_M5C_GENERATION: ${{ matrix.generation }}
        run: |
          node --test ./tests/pinned-skill-runtime.runtime.mjs

  skill-policy-agent-loop:
    name: M5B ToolSkill AgentLoop E2E (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: 0.1.1-rc.2, cordis: 4.0.1, schemastery: 3.18.1, generation: legacy }
          - { version: 0.1.6-alpha.2, cordis: 4.0.2, schemastery: 3.18.2, generation: current }
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install selected real Skill/AgentLoop generation
        run: |
          pnpm add --save-dev --save-exact \
            @deepseek-ai/cordis@${{ matrix.cordis }} \
            @deepseek-ai/schemastery@${{ matrix.schemastery }} \
            @deepseek-ai/dsh-agent@${{ matrix.version }} \
            @deepseek-ai/dsh-agent-loop@${{ matrix.version }} \
            @deepseek-ai/dsh-invariants@${{ matrix.version }} \
            @deepseek-ai/dsh-llm@${{ matrix.version }} \
            @deepseek-ai/dsh-scope@${{ matrix.version }} \
            @deepseek-ai/dsh-session@${{ matrix.version }} \
            @deepseek-ai/dsh-session-persistence@${{ matrix.version }} \
            @deepseek-ai/dsh-session-projection@${{ matrix.version }} \
            @deepseek-ai/dsh-skill@${{ matrix.version }} \
            @deepseek-ai/dsh-system-prompt@${{ matrix.version }} \
            @deepseek-ai/dsh-tool-skill@${{ matrix.version }} \
            @deepseek-ai/dsh-typert-protocol@${{ matrix.version }} \
            @deepseek-ai/dsh-tools@${{ matrix.version }}
      - name: Build and run real ToolSkill M5B E2E
        env:
          DSH_M5B_E2E_GENERATION: ${{ matrix.generation }}
        run: |
          pnpm run build
          node ./tests/skill-runtime-agent-loop.e2e.mjs

  pinned-skill-agent-loop:
    name: M5C Pinned Skill AgentLoop E2E (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: 0.1.1-rc.2, cordis: 4.0.1, schemastery: 3.18.1, generation: legacy }
          - { version: 0.1.2-rc.1, cordis: 4.0.2, schemastery: 3.18.2, generation: current }
          - { version: 0.1.5-rc.1, cordis: 4.0.2, schemastery: 3.18.2, generation: current }
          - { version: 0.1.6-alpha.2, cordis: 4.0.2, schemastery: 3.18.2, generation: current }
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install selected real Skill/AgentLoop generation
        run: |
          pnpm add --save-dev --save-exact \
            @deepseek-ai/cordis@${{ matrix.cordis }} \
            @deepseek-ai/schemastery@${{ matrix.schemastery }} \
            @deepseek-ai/dsh-agent@${{ matrix.version }} \
            @deepseek-ai/dsh-agent-loop@${{ matrix.version }} \
            @deepseek-ai/dsh-invariants@${{ matrix.version }} \
            @deepseek-ai/dsh-llm@${{ matrix.version }} \
            @deepseek-ai/dsh-scope@${{ matrix.version }} \
            @deepseek-ai/dsh-session@${{ matrix.version }} \
            @deepseek-ai/dsh-session-persistence@${{ matrix.version }} \
            @deepseek-ai/dsh-session-projection@${{ matrix.version }} \
            @deepseek-ai/dsh-skill@${{ matrix.version }} \
            @deepseek-ai/dsh-system-prompt@${{ matrix.version }} \
            @deepseek-ai/dsh-tool-skill@${{ matrix.version }} \
            @deepseek-ai/dsh-typert-protocol@${{ matrix.version }} \
            @deepseek-ai/dsh-tools@${{ matrix.version }}
      - name: Build and run real M5C E2E
        env:
          DSH_M5C_E2E_GENERATION: ${{ matrix.generation }}
        run: |
          pnpm run build
          node ./tests/pinned-skill-runtime-agent-loop.e2e.mjs

  remote-foundation-artifact:
    name: oldest-built package artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build the one oldest-generation package artifact
        run: pnpm run build
      - name: Upload the exact oldest-built package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-context-manager-oldest-lib
          path: lib
          if-no-files-found: error

  remote-foundation-contract:
    name: M6C preset/runtime Remote (${{ matrix.version }})
    needs: remote-foundation-artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: 0.1.1-rc.2, cordis: 4.0.1, schemastery: 3.18.1 }
          - { version: 0.1.2-rc.1, cordis: 4.0.2, schemastery: 3.18.2 }
          - { version: 0.1.5-rc.1, cordis: 4.0.2, schemastery: 3.18.2 }
          - { version: 0.1.5-rc.2, cordis: 4.0.2, schemastery: 3.18.2 }
          - { version: 0.1.6-alpha.2, cordis: 4.0.2, schemastery: 3.18.2 }
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Discard install-time prepare output
        run: rm -rf lib
      - name: Restore the one oldest-built package artifact
        uses: actions/download-artifact@v4
        with:
          name: dsh-context-manager-oldest-lib
          path: lib
      - name: Switch only the runtime Typert/Gateway generation
        run: |
          pnpm add --ignore-scripts --save-dev --save-exact \
            @deepseek-ai/cordis@${{ matrix.cordis }} \
            @deepseek-ai/schemastery@${{ matrix.schemastery }} \
            @deepseek-ai/dsh-api-gateway@${{ matrix.version }} \
            @deepseek-ai/dsh-typert-protocol@${{ matrix.version }} \
            @deepseek-ai/dsh-typert-registry@${{ matrix.version }}
      - name: Invoke generated descriptor through the real Gateway
        run: node ./tests/remote-upstream-runtime.mjs

  client-foundation-contract:
    name: M7B0 retained Client presentation runtime (${{ matrix.version }})
    needs: remote-foundation-artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: 0.1.1-rc.2, cordis: 4.0.1 }
          - { version: 0.1.2-rc.1, cordis: 4.0.2 }
          - { version: 0.1.5-rc.1, cordis: 4.0.2 }
          - { version: 0.1.5-rc.2, cordis: 4.0.2 }
          - { version: 0.1.6-alpha.2, cordis: 4.0.2 }
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Discard install-time prepare output
        run: rm -rf lib
      - name: Restore the one oldest-built Client artifact
        uses: actions/download-artifact@v4
        with:
          name: dsh-context-manager-oldest-lib
          path: lib
      - name: Install selected retained production SlotCore
        run: |
          pnpm add --ignore-scripts --save-dev --save-exact \
            @deepseek-ai/cordis@${{ matrix.cordis }} \
            @deepseek-ai/dsh-invariants@${{ matrix.version }} \
            @deepseek-ai/dsh-client-ui-slots@${{ matrix.version }}
      - name: Validate the exact Client artifact against retained production SlotCore
        run: node ./tests/client-upstream-runtime.mjs

  client-presentation-contract:
    name: M7B0 primary Client presentation contract (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        version: [0.1.5-rc.1, 0.1.5-rc.2, 0.1.6-alpha.2]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install selected retained Client declaration surface
        run: |
          pnpm add --ignore-scripts --save-dev --save-exact \
            @deepseek-ai/cordis@4.0.2 \
            @deepseek-ai/dsh-client-ui-slots@${{ matrix.version }} \
            @deepseek-ai/dsh-client-ui-sidebar@${{ matrix.version }} \
            @deepseek-ai/dsh-client-ui-layout@${{ matrix.version }} \
            @types/react@18.3.31
      - name: Compile M7B0 public Client presentation contract
        run: |
          pnpm exec tsc --ignoreConfig --noEmit --strict --skipLibCheck \
            --module NodeNext --moduleResolution NodeNext --target ES2024 \
            tests/client-upstream-contract.ts

  package:
    name: verify packed bundle
    needs: [verify, settings-modern, agent-presets-contract, session-preset-contract, prompt-library-contract, prompt-placement-contract, prompt-runtime-contract, prompt-runtime-agent-loop, skill-runtime-contract, skill-policy-runtime-contract, skill-policy-agent-loop, pinned-skill-runtime-contract, pinned-skill-agent-loop, remote-foundation-contract, client-foundation-contract, client-presentation-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Verify packed file surface
        run: |
          mkdir -p .artifacts
          pnpm pack --pack-destination .artifacts
          tarball=$(find .artifacts -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$tarball"
          tar -tzf "$tarball" | sort | tee .artifacts/package-files.txt
          grep -Fx 'package/lib/index.js' .artifacts/package-files.txt
          grep -Fx 'package/lib/index.d.ts' .artifacts/package-files.txt
          grep -Fx 'package/lib/typert.host.js' .artifacts/package-files.txt
          grep -Fx 'package/lib/typert.host.d.ts' .artifacts/package-files.txt
          grep -Fx 'package/lib/typert.remote-client.js' .artifacts/package-files.txt
          grep -Fx 'package/lib/typert.remote-client.d.ts' .artifacts/package-files.txt
          grep -Fx 'package/lib/typert.remote-client.d.ts.map' .artifacts/package-files.txt
          grep -Fx 'package/lib/client.js' .artifacts/package-files.txt
          grep -Fx 'package/lib/client.js.map' .artifacts/package-files.txt
          grep -Fx 'package/lib/client-contract.d.ts' .artifacts/package-files.txt
          grep -Fx 'package/cordis.patch.yml' .artifacts/package-files.txt
          grep -Fx 'package/package.json' .artifacts/package-files.txt
      - name: Verify packed package peer compatibility
        run: |
          tarball=$(find "$GITHUB_WORKSPACE/.artifacts" -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$tarball"
          for settings_version in 0.1.5-rc.2 0.1.6-alpha.2; do
            smoke_dir="$GITHUB_WORKSPACE/.peer-smoke-$settings_version"
            mkdir -p "$smoke_dir"
            cd "$smoke_dir"
            printf '%s\n' '{"name":"dsh-context-manager-peer-smoke","private":true}' > package.json
            pnpm add --strict-peer-dependencies @deepseek-ai/cordis@4.0.2 "@deepseek-ai/dsh-settings@$settings_version" "@deepseek-ai/dsh-scope@$settings_version" "@deepseek-ai/dsh-skill@$settings_version" "@deepseek-ai/dsh-typert-protocol@$settings_version" @deepseek-ai/schemastery@3.18.2 "$tarball"
          done

  dsh-smoke:
    name: published DSH bundle smoke (${{ matrix.version }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        version: [0.1.2-rc.1, 0.1.5-rc.1, 0.1.5-rc.2, 0.1.6-alpha.2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DSH_HOME: ${{ github.workspace }}/.dsh-ci-home-${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - name: Install and build this plugin
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Install bundle into a temporary DSH profile
        run: pnpm dlx @deepseek-ai/dsh@${{ matrix.version }} plugin --profile context-manager-ci add "$GITHUB_WORKSPACE"
      - name: Verify DSH composed configuration
        run: |
          pnpm dlx @deepseek-ai/dsh@${{ matrix.version }} --profile context-manager-ci --dump-config > .dsh-composed.yml
          grep -F 'dsh-context-manager' .dsh-composed.yml
