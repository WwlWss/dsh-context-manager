name: M8C B3-E Draft five-version Native Host Remote preflight

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/m8c-b3-host-preflight.yml'
      - 'tests/preset-authoring-upstream-runtime.mjs'
      - 'src/adapters/preset-authoring.ts'
      - 'src/service/preset-authoring.ts'
      - 'src/service/remote.ts'
      - 'src/remote/results.ts'
      - 'src/client/preset-mutation-controller.ts'
      - 'docs/m8c-b3-implementation-plan.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-native-remote:
    name: M8C Native Remote+Host (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: 0.1.1-rc.2, cordis: 4.0.1 }
          - { version: 0.1.2-rc.1, cordis: 4.0.2 }
          - { version: 0.1.5-rc.1, cordis: 4.0.2 }
          - { version: 0.1.5-rc.2, cordis: 4.0.2 }
          - { version: 0.1.6-alpha.2, cordis: 4.0.2 }
    env:
      DSH_HOME: ${{ github.workspace }}/.dsh-m8c-preflight-home-${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install actual retained native Host packages
        run: |
          pnpm add --save-dev --save-exact \
            @deepseek-ai/cordis@${{ matrix.cordis }} \
            @deepseek-ai/cordis-plugin-loader@1.0.3 \
            @deepseek-ai/dsh-agent-presets@${{ matrix.version }} \
            @deepseek-ai/dsh-typert-protocol@${{ matrix.version }} \
            @deepseek-ai/dsh-session-projection@${{ matrix.version }}
      - name: Build exact published-Host native bridge
        run: pnpm run build
      - name: Published native filesystem through actual Host Remote methods
        run: node ./tests/preset-authoring-upstream-runtime.mjs
