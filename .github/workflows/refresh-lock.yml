name: Refresh PR2 lockfile

on:
  push:
    branches:
      - feat/context-profile-domain

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - name: Refresh lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git commit -m "chore: refresh pnpm lockfile"
          git push
