name: M8B B0 Published Contract Preflight (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/m8b-b0-published-preflight.yml
      - tests/m8b-published-host-preflight.test.mjs
      - tests/m8b-published-gateway-preflight.mjs
      - tests/m8b-client-contract-preflight.ts
      - scripts/verify-m8b-b0-evidence.mjs
      - docs/m8b-plan.md

permissions:
  contents: read

env:
  M8B_B0_TEST_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  oldest-built:
    name: B0 one oldest-built Host and Client artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build the exact candidate once under oldest pinned dependencies
        run: |
          pnpm run clean
          pnpm run build
          test -f lib/index.js
          test -f lib/typert.host.js
          test -f lib/typert.remote-client.js
      - uses: actions/upload-artifact@v4
        with:
          name: m8b-b0-oldest-lib
          path: lib
          if-no-files-found: error

  host:
    name: B0 published Host/Remote (${{ matrix.version }})
    needs: oldest-built
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: 0.1.1-rc.2, cordis: 4.0.1, schemastery: 3.18.1 }
          - { version: 0.1.2-rc.1, cordis: 4.0.2, schemastery: 3.18.2 }
          - { version: 0.1.5-rc.1, cordis: 4.0.2, schemastery: 3.18.2 }
          - { version: 0.1.5-rc.2, cordis: 4.0.2, schemastery: 3.18.2 }
          - { version: 0.1.6-alpha.2, cordis: 4.0.2, schemastery: 3.18.2 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Remove install-time build; restore one frozen oldest-built artifact
        run: rm -rf lib
      - uses: actions/download-artifact@v4
        with:
          name: m8b-b0-oldest-lib
          path: lib
      - name: Overlay the exact retained published Host/Settings/Typert/Skill generation
        run: |
          pnpm add --ignore-scripts --save-dev --save-exact \
            @deepseek-ai/cordis@${{ matrix.cordis }} \
            @deepseek-ai/schemastery@${{ matrix.schemastery }} \
            @deepseek-ai/dsh-settings@${{ matrix.version }} \
            @deepseek-ai/dsh-scope@${{ matrix.version }} \
            @deepseek-ai/dsh-skill@${{ matrix.version }} \
            @deepseek-ai/dsh-api-gateway@${{ matrix.version }} \
            @deepseek-ai/dsh-typert-registry@${{ matrix.version }} \
            @deepseek-ai/dsh-typert-protocol@${{ matrix.version }}
      - name: Execute H01-H13 real Settings and R01-R06 strict Gateway assertions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/m8b-b0
          node --test tests/m8b-published-host-preflight.test.mjs tests/m8b-published-gateway-preflight.mjs \
            2>&1 | tee .artifacts/m8b-b0/host-${{ matrix.version }}.log
      - name: Emit exact-source verified Host/Remote assertion manifest
        run: |
          node scripts/verify-m8b-b0-evidence.mjs emit host ${{ matrix.version }} \
            .artifacts/m8b-b0/host-${{ matrix.version }}.log \
            .artifacts/m8b-b0/host-${{ matrix.version }}.json
      - name: Upload fail-closed published assertion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8b-b0-evidence-host-${{ matrix.version }}
          path: .artifacts/m8b-b0/host-${{ matrix.version }}.json
          if-no-files-found: warn
      - name: Retain failure logs without pretending to have PASS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8b-b0-logs-host-${{ matrix.version }}
          path: .artifacts/m8b-b0/host-${{ matrix.version }}.log
          if-no-files-found: warn

  client:
    name: B0 published Client/Renderer (${{ matrix.version }})
    needs: oldest-built
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: [0.1.2-rc.1, 0.1.5-rc.1, 0.1.5-rc.2, 0.1.6-alpha.2]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Remove install-time build; restore frozen remote declaration and Client artifact
        run: rm -rf lib
      - uses: actions/download-artifact@v4
        with:
          name: m8b-b0-oldest-lib
          path: lib
      - name: Overlay selected genuine Client/React published generation
        run: |
          pnpm add --ignore-scripts --save-dev --save-exact \
            @deepseek-ai/cordis@4.0.2 \
            @deepseek-ai/dsh-invariants@${{ matrix.version }} \
            @deepseek-ai/dsh-client-store@${{ matrix.version }} \
            @deepseek-ai/dsh-client-locale@${{ matrix.version }} \
            @deepseek-ai/dsh-client-ui-slots@${{ matrix.version }} \
            @deepseek-ai/dsh-client-ui-renderer@${{ matrix.version }} \
            @deepseek-ai/dsh-client-ui-sidebar@${{ matrix.version }} \
            @deepseek-ai/dsh-client-ui-layout@${{ matrix.version }} \
            @deepseek-ai/dsh-typert-protocol@${{ matrix.version }} \
            @types/react@18.3.31 \
            react@18.3.1 \
            react-dom@18.3.1 \
            react-test-renderer@18.3.1
      - name: Compile C01, run C02 Slot and C03 full existing Drawer real Renderer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/m8b-b0
          {
            pnpm exec tsc --ignoreConfig --noEmit --strict --skipLibCheck \
              --module NodeNext --moduleResolution NodeNext --target ES2024 \
              src/client/css-modules.d.ts \
              src/client/context.ts src/client-contract.ts \
              src/client/model-types.ts src/client/mutation-types.ts src/client/remote-port.ts \
              src/client/mutation-controller.ts src/client/model.ts src/client/business-face.ts src/client/plugin.ts \
              tests/client-upstream-contract.ts tests/client-generated-remote-contract.ts \
              tests/m8b-client-contract-preflight.ts
            printf '%s\n' 'M8B_B0_ASSERT {"id":"C01","outcome":"pass"}'
            node tests/client-renderer-bridge-runtime.mjs
            printf '%s\n' 'M8B_B0_ASSERT {"id":"C02","outcome":"pass"}'
            node tests/client-profile-drawer-runtime.mjs
            printf '%s\n' 'M8B_B0_ASSERT {"id":"C03","outcome":"pass"}'
          } 2>&1 | tee .artifacts/m8b-b0/client-${{ matrix.version }}.log
      - name: Emit exact-source verified Client assertions manifest
        run: |
          node scripts/verify-m8b-b0-evidence.mjs emit client ${{ matrix.version }} \
            .artifacts/m8b-b0/client-${{ matrix.version }}.log \
            .artifacts/m8b-b0/client-${{ matrix.version }}.json
      - name: Upload fail-closed Client assertion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8b-b0-evidence-client-${{ matrix.version }}
          path: .artifacts/m8b-b0/client-${{ matrix.version }}.json
          if-no-files-found: warn
      - name: Retain Client failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8b-b0-logs-client-${{ matrix.version }}
          path: .artifacts/m8b-b0/client-${{ matrix.version }}.log
          if-no-files-found: warn

  qualification:
    name: B0 fail-closed nine published-generation contract qualification
    if: always()
    needs: [oldest-built, host, client]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Collect nine independently produced immutable assertion manifests
        uses: actions/download-artifact@v4
        with:
          pattern: m8b-b0-evidence-*
          path: .artifacts/m8b-b0/collected
          merge-multiple: false
      - name: Validate all expected versions, exact Head and every asserted preflight gate
        env:
          M8B_B0_BUILD_RESULT: ${{ needs.oldest-built.result }}
          M8B_B0_HOST_RESULT: ${{ needs.host.result }}
          M8B_B0_CLIENT_RESULT: ${{ needs.client.result }}
        run: |
          node scripts/verify-m8b-b0-evidence.mjs verify \
            .artifacts/m8b-b0/collected ${{ github.event.pull_request.head.sha }}
