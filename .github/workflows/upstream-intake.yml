name: DSH upstream artifact intake (candidate only)

on:
  pull_request:
    paths:
      - 'scripts/probe-dsh-published-artifacts.mjs'
      - '.github/workflows/upstream-intake.yml'
  workflow_dispatch:
    inputs:
      version:
        description: Candidate release for published-artifact preflight
        type: choice
        required: true
        options:
          - 0.1.6-alpha.2
          - 0.2.0-rc.2
          - 0.2.1-alpha.2

permissions:
  contents: read

jobs:
  published-artifacts:
    name: candidate artifact preflight (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.version) || '["0.1.6-alpha.2","0.2.0-rc.2","0.2.1-alpha.2"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
      - name: Probe exact npm-published exports and types
        run: node ./scripts/probe-dsh-published-artifacts.mjs "${{ matrix.version }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-public-artifact-intake-${{ matrix.version }}
          path: .artifacts/dsh-intake-${{ matrix.version }}.json
          if-no-files-found: ignore
