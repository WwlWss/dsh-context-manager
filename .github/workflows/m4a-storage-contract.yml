name: M4A Storage contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: m4a-storage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: public DomainSpec (${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 0.1.1-rc.2
            cordis: 4.0.1
          - version: 0.1.2-rc.1
            cordis: 4.0.2
          - version: 0.1.5-rc.1
            cordis: 4.0.2
          - version: 0.1.5-rc.2
            cordis: 4.0.2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.20.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Install selected public Storage declarations
        run: |
          pnpm add --save-dev --save-exact \
            @deepseek-ai/cordis@${{ matrix.cordis }} \
            @deepseek-ai/dsh-storage@${{ matrix.version }} \
            @deepseek-ai/dsh-storage-domain@${{ matrix.version }}

      - name: Compile the public DomainSpec contract
        run: |
          pnpm exec tsc \
            --ignoreConfig \
            --noEmit \
            --strict \
            --skipLibCheck \
            --module NodeNext \
            --moduleResolution NodeNext \
            --target ES2024 \
            tests/prompt-library-upstream-contract.ts
